<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-up form</title>
  <link rel="stylesheet" href="style.css">
  <script src="javascript.js" defer></script>
</head>
<body>


  <div class="container left">
    <img id="background-image" src="halie-west-25xggax4bSA-unsplash.jpg" alt="">
    <div class="left-container">
      <div class="logo-container">
        <img id="odin-logo" src="odin-logo.png" alt="">
        <p>Odin</p>
      </div>
    </div>
    <p>Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a href="https://unsplash.com">Unsplash</a></p>
    </div>
    </div>
    
    
    
    <div class="container right">
      <div class="box one">
        <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <i>now</i> to get started.</p>
        <p>You <i>know</i> you want to.</p>
      </div>
      <div class="box two">
        <form id="sign-up-form" action="">
          <fieldset>
            <legend>Let's do this!</legend>
            <div>
              <div>
                <label for="first-name">First Name</label><br>
                <input type="text" id="first-name" name="first-name"  required>
              </div>
              <div>
                <label for="last-name">Last name</label><br>
                <input type="text" id="last-name" name="last-name"  required>
              </div>
            </div>
            <div>
              <div>
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email"  required>
              </div>
              <div>
                <label for="phone-number">Phone number</label><br>
                <input type="tel" id="phone-number" name="phone-number" minlength="10" maxlength="14"  required>
              </div>
            </div>
            <div>
              <div>
                <label for="password">Password</label><br>
                <input type="password" id="password" name="password" pattern="/^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,}$/" required>
              </div>
              <div>
                <label for="password-confirm">Confirm password</label><br>
                <input type="password" id="password-confirm" name="password-confirm" pattern="/^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,}$/" required>
              </div>
            </div>
          </fieldset>
        </form>
      </div>
      <div class="box three">
        <button type="submit" form="sign-up-form">Create Account</button>
        <p>Already have an account? <a href="">Log in</a></p>
      </div>
    </div>

</body>
</html>
